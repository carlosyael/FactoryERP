name: FactoryERP CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore FactoryERP.sln

      - name: Build Release (Strict Zero Warnings)
        run: dotnet build FactoryERP.sln --configuration Release --no-restore /warnaserror

      - name: Run TDD & Integration Tests
        run: dotnet test FactoryERP.sln --configuration Release --no-build --verbosity normal

  deploy-azure:
    needs: build-and-test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: production-azure
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry via OIDC
        shell: bash
        run: |
          ACR_TOKEN=$(az acr login --name "${{ vars.ACR_NAME }}" --expose-token --output tsv --query accessToken)
          echo "::add-mask::$ACR_TOKEN"
          echo "$ACR_TOKEN" | docker login "${{ vars.ACR_LOGIN_SERVER }}" --username 00000000-0000-0000-0000-000000000000 --password-stdin

      - name: Build and push container image to ACR
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/factoryerp-web:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/factoryerp-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy new revision to Azure Container Apps
        shell: bash
        run: |
          IMAGE="${{ vars.ACR_LOGIN_SERVER }}/factoryerp-web:${{ github.sha }}"
          SUB_ID=$(az account show --query id -o tsv)
          APP_URI="https://management.azure.com/subscriptions/${SUB_ID}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.App/containerApps/${{ vars.AZURE_CONTAINERAPP_NAME }}?api-version=2024-03-01"
          CURRENT_TEMPLATE=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.template" -o json)
          PATCH_FILE=$(mktemp)
          trap 'rm -f "$PATCH_FILE"' EXIT
          jq -n \
            --argjson tpl "$CURRENT_TEMPLATE" \
            --arg img "$IMAGE" \
            --arg server "${{ vars.ACR_LOGIN_SERVER }}" \
            --arg user "${{ vars.ACR_NAME }}" \
            --arg ref "${{ vars.ACR_NAME }}azurecrio-${{ vars.ACR_NAME }}" \
            '{
              properties: {
                configuration: {
                  registries: [{
                    server: $server,
                    username: $user,
                    passwordSecretRef: $ref
                  }]
                },
                template: {
                  containers: [
                    ($tpl.containers[0] | {
                      name,
                      image: $img,
                      env,
                      resources: {
                        cpu: .resources.cpu,
                        memory: .resources.memory
                      }
                    })
                  ]
                }
              }
            }' > "$PATCH_FILE"
          az rest --method patch --uri "$APP_URI" --headers "Content-Type=application/json" --body "@${PATCH_FILE}" -o none

      - name: Verify live production health
        shell: bash
        run: |
          FQDN=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          HEALTH_URL="https://${FQDN}/health"
          echo "Verificando endpoint de salud: $HEALTH_URL"
          for i in $(seq 1 24); do
            RESPONSE=$(curl -sS -w "\n%{http_code}" "$HEALTH_URL" || true)
            CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "Intento $i/24 -> HTTP $CODE | $BODY"
            if [ "$CODE" = "200" ] && echo "$BODY" | grep -q '"database":"connected"' && echo "$BODY" | grep -qE '"platform":"G(é|\\u00[eE]9)nesis"'; then
              echo "Despliegue saludable en produccion!"
              exit 0
            fi
            sleep 10
          done
          echo "Error: /health no respondio 200 OK con base de datos conectada y plataforma Genesis."
          exit 1
